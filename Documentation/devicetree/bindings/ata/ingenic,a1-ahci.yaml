%YAML 1.2
---
$id: http://devicetree.org/schemas/ata/ingenic,a1-ahci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic A1 AHCI SATA Controller

maintainers:
  - Alfonso Gamboa <gtxent@gmail.com>

description:
  The A1's two-port AHCI controller comes with an Innophy SATA PHY for each
  port, which the driver tunes before the host comes up.

allOf:
  - $ref: ahci-common.yaml#

properties:
  compatible:
    const: ingenic,a1-ahci

  reg:
    items:
      - description: AHCI registers
      - description: PHY of port 0
      - description: PHY of port 1

  reg-names:
    items:
      - const: ahci
      - const: phy0
      - const: phy1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  ingenic,srbc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Syscon of the CPM soft reset and bus control register, whose bit 18
      resets the controller.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - ingenic,srbc

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/ingenic,a1-cgu.h>

    sata@130d0000 {
        compatible = "ingenic,a1-ahci";
        reg = <0x130d0000 0x10000>, <0x10080000 0x10000>, <0x10090000 0x10000>;
        reg-names = "ahci", "phy0", "phy1";
        interrupts = <43>;
        clocks = <&cgu A1_CLK_SATA>;
        ports-implemented = <0x3>;
        ingenic,srbc = <&srbc>;
    };
