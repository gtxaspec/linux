%YAML 1.2
---
$id: http://devicetree.org/schemas/mips/ingenic/ingenic,xburst2-ccu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic XBurst2 core control unit

maintainers:
  - Alfonso Gamboa <gtxent@gmail.com>

description:
  The core control unit (CCU) of the XBurst2 multi-core CPU holds the
  per-core software reset and reset entry address, the per-core masks of the
  peripheral, mailbox and OST interrupts, and one mailbox register per core.
  The kernel starts the secondary cores through the reset registers and sends
  inter-processor interrupts through the mailboxes.

properties:
  compatible:
    const: ingenic,xburst2-ccu

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: The CPU interrupt pin of the mailbox interrupt (pin 3)

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    cpu-control@12200000 {
        compatible = "ingenic,xburst2-ccu";
        reg = <0x12200000 0x2000>;

        interrupt-parent = <&cpuintc>;
        interrupts = <3>;
    };
...
