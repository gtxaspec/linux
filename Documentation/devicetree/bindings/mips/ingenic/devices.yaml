%YAML 1.2
---
$id: http://devicetree.org/schemas/mips/ingenic/devices.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic XBurst based Platforms

maintainers:
  - 周琰杰 (Zhou Yanjie) <zhouyanjie@wanyeetech.com>

description:
  Devices with a Ingenic XBurst CPU shall have the following properties.

properties:
  $nodename:
    const: '/'
  compatible:
    oneOf:

      - description: Qi Hardware Ben NanoNote
        items:
          - const: qi,lb60
          - const: ingenic,jz4740

      - description: YLM RetroMini RS-90
        items:
          - const: ylm,rs90
          - const: ingenic,jz4725b

      - description: Game Consoles Worldwide GCW Zero
        items:
          - const: gcw,zero
          - const: ingenic,jz4770

      - description: MIPS Creator CI20
        items:
          - const: img,ci20
          - const: ingenic,jz4780

      - description: YSH & ATIL General Board, CU1000 Module with Neo Backplane
        items:
          - const: yna,cu1000-neo
          - const: ingenic,x1000e

      - description: YSH & ATIL General Board, CU1830 Module with Neo Backplane
        items:
          - const: yna,cu1830-neo
          - const: ingenic,x1830

      - description: YSH & ATIL General Board, CU2000 Module with Neo Backplane
        items:
          - const: yna,cu2000-neo
          - const: ingenic,x2000e

      - description: Thingino board for the Ingenic T10
        items:
          - const: thingino,t10
          - const: ingenic,t10

      - description: Thingino board for the Ingenic T20
        items:
          - const: thingino,t20
          - const: ingenic,t20

      - description: Thingino board for the Ingenic T21
        items:
          - const: thingino,t21
          - const: ingenic,t21

      - description: Thingino board for the Ingenic T23
        items:
          - const: thingino,t23
          - const: ingenic,t23

      - description: Thingino board for the Ingenic T30
        items:
          - const: thingino,t30
          - const: ingenic,t30

      - description: Thingino generic board for the Ingenic T31
        items:
          - const: thingino,t31
          - const: ingenic,t31

      - description: Thingino generic board for the Ingenic T32
        items:
          - const: thingino,t32
          - const: ingenic,t32

      - description: Cinnado D1 camera with the Ingenic T32LQ
        items:
          - const: thingino,t32-cinnado-d1
          - const: thingino,t32
          - const: ingenic,t32

      - description: Thingino generic board for the Ingenic T33
        items:
          - const: thingino,t33
          - const: ingenic,t33

      - description: Thingino generic board for the Ingenic T41
        items:
          - const: thingino,t41
          - const: ingenic,t41

additionalProperties: true

...
