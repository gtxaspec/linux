%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/ingenic,t32-pwm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic T32, T33 and T41 PWM controller

maintainers:
  - Paul Cercueil <paul@crapouillou.net>

description:
  The dedicated PWM controller of the T32 and T33 SoCs, with four channels,
  and of the T41, with eight. It is separate from the TCU, whose channels
  have no PWM output pin on these SoCs.

allOf:
  - $ref: pwm.yaml#

properties:
  compatible:
    oneOf:
      - enum:
          - ingenic,t32-pwm
          - ingenic,t41-pwm
      - items:
          - enum:
              - ingenic,t32pro-pwm
              - ingenic,t33-pwm
          - const: ingenic,t32-pwm

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  "#pwm-cells":
    const: 3

required:
  - compatible
  - reg
  - clocks
  - "#pwm-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/ingenic,t32-cgu.h>

    pwm@13450000 {
        compatible = "ingenic,t32-pwm";
        reg = <0x13450000 0x1000>;

        clocks = <&cgu T32_CLK_PWM>;
        assigned-clocks = <&cgu T32_CLK_PWM>;
        assigned-clock-rates = <50000000>;

        #pwm-cells = <3>;
    };
