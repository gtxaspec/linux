%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/ingenic,sfc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ingenic SoCs SPI flash controller

maintainers:
  - Alfonso Gamboa <gtxent@gmail.com>

description:
  The SFC of Ingenic SoCs, a SPI controller dedicated to serial NOR and
  NAND flash.

allOf:
  - $ref: /schemas/spi/spi-controller.yaml#

properties:
  compatible:
    oneOf:
      - enum:
          - ingenic,x1000-sfc
          - ingenic,t32-sfc
      - items:
          - enum:
              - ingenic,t10-sfc
              - ingenic,t20-sfc
              - ingenic,t21-sfc
              - ingenic,t23-sfc
              - ingenic,t30-sfc
              - ingenic,t31-sfc
          - const: ingenic,x1000-sfc
      - items:
          - const: ingenic,t33-sfc
          - const: ingenic,t32-sfc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    const: sfc

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/ingenic,t32-cgu.h>

    spi@13440000 {
      compatible = "ingenic,t32-sfc";
      reg = <0x13440000 0x10000>;

      interrupt-parent = <&intc>;
      interrupts = <7>;

      clocks = <&cgu T32_CLK_SFC0>;
      clock-names = "sfc";

      #address-cells = <1>;
      #size-cells = <0>;

      flash@0 {
        compatible = "jedec,spi-nor";
        reg = <0>;
        spi-max-frequency = <25000000>;
      };
    };
