%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/ingenic,xburst2-ost.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OSTs in Ingenic XBurst2 SoCs

maintainers:
  - Alfonso Gamboa <gtxent@gmail.com>

description:
  The XBurst2 SoCs have one 64-bit global OST, used as clocksource, and a
  32-bit OST in a register window of its own for every core, used as that
  core's clockevent. The core OST of a core interrupts that core only, on CPU
  interrupt pin 4, once the core's OST interrupt is enabled in the core
  control unit.

properties:
  compatible:
    const: ingenic,t41-ost

  reg:
    items:
      - description: Global OST
      - description: Core OSTs, one window every 0x100 bytes

  reg-names:
    items:
      - const: global
      - const: core

  clocks:
    maxItems: 1

  clock-names:
    const: ost

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - interrupts

additionalProperties: false

examples:
  - |
    timer@12000000 {
        compatible = "ingenic,t41-ost";
        reg = <0x12000000 0x10000>, <0x12100000 0x10000>;
        reg-names = "global", "core";

        clocks = <&cgu 0>;
        clock-names = "ost";

        interrupt-parent = <&cpuintc>;
        interrupts = <4>;
    };
...
