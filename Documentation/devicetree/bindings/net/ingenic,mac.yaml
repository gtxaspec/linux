%YAML 1.2
---
$id: http://devicetree.org/schemas/net/ingenic,mac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MAC in Ingenic SoCs

maintainers:
  - 周琰杰 (Zhou Yanjie) <zhouyanjie@wanyeetech.com>

description:
  The Ethernet Media Access Controller in Ingenic SoCs.

allOf:
  - $ref: snps,dwmac.yaml#

properties:
  compatible:
    oneOf:
      - enum:
          - ingenic,jz4775-mac
          - ingenic,x1000-mac
          - ingenic,x1600-mac
          - ingenic,x1830-mac
          - ingenic,x2000-mac
      - items:
          - enum:
              - ingenic,t21-mac
              - ingenic,t23-mac
              - ingenic,t30-mac
              - ingenic,t31-mac
              - ingenic,t32-mac
          - const: snps,dwmac
      - items:
          - const: ingenic,t33-mac
          - const: ingenic,t32-mac
          - const: snps,dwmac

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: macirq

  clocks:
    maxItems: 1

  clock-names:
    const: stmmaceth

  mode-reg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: An extra syscon register that control ethernet interface and timing delay

  ingenic,phy-id-reg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Syscon of the CPM MAC PHY parameter register (MACPHYP), which holds the
      identifier that the SoC's internal PHY reports on MDIO.

  rx-clk-delay-ps:
    description: RGMII receive clock delay defined in pico seconds

  tx-clk-delay-ps:
    description: RGMII transmit clock delay defined in pico seconds

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - mode-reg

if:
  properties:
    compatible:
      contains:
        const: ingenic,t21-mac
then:
  required:
    - ingenic,phy-id-reg
else:
  properties:
    ingenic,phy-id-reg: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/ingenic,x1000-cgu.h>

    mac: ethernet@134b0000 {
        compatible = "ingenic,x1000-mac";
        reg = <0x134b0000 0x2000>;

        interrupt-parent = <&intc>;
        interrupts = <55>;
        interrupt-names = "macirq";

        clocks = <&cgu X1000_CLK_MAC>;
        clock-names = "stmmaceth";

        mode-reg = <&mac_phy_ctrl>;

        phy-mode = "rmii";
    };
...
